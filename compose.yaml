# PostgreSQL for local development. Start it with `docker compose up -d` and
# run the server with
# SHUTTLEPUB_DATABASE_URL=postgres://shuttlepub:shuttlepub@127.0.0.1:5432/shuttlepub
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: shuttlepub
      POSTGRES_PASSWORD: shuttlepub
      POSTGRES_DB: shuttlepub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "shuttlepub", "-d", "shuttlepub"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
